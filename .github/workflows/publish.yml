name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      registry:
        description: Registry target
        required: true
        default: both
        type: choice
        options:
          - both
          - npm
          - github

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm run pack:dry

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.registry == 'npm' || inputs.registry == 'both'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for npm
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error title=NPM_TOKEN is missing::Add an npm publish token as a repository secret named NPM_TOKEN."
            exit 1
          fi

          npm whoami --registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Prepare npm provenance metadata
        run: |
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/${{ github.repository }}"
          npm pkg set bugs.url="https://github.com/${{ github.repository }}/issues"
          npm pkg set homepage="https://github.com/${{ github.repository }}#readme"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  publish-github:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.registry == 'github' || inputs.registry == 'both'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Prepare GitHub Packages metadata
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          npm config set "@${owner}:registry" "https://npm.pkg.github.com" --location project
          npm pkg set name="@${owner}/react-signalr"
          npm pkg set repository.type="git"
          npm pkg set repository.url="git+https://github.com/${{ github.repository }}.git"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
